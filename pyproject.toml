[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sense-emu-x"
dynamic = ["version"]
description = "Cross-platform Raspberry Pi Sense HAT emulator (Windows, Linux, macOS)"
readme = "README.rst"
# Library: LGPL-2.1+; sense_emu_gui / sense_rec / sense_play / sense_csv: GPL-2.0+
license = "LGPL-2.1-or-later AND GPL-2.0-or-later"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Raspberry Pi Foundation", email = "info@raspberrypi.org" },
]
maintainers = [
    { name = "sense-emu-x contributors" },
]
keywords = ["raspberrypi", "sense", "hat", "emulator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "Pillow",
]

[project.optional-dependencies]
gui = ["PySide6"]
tui = ["textual"]
test = [
    "pytest",
    "pytest-cov",
    "pytest-env",
    "pytest-qt",
    "mock",
    "PySide6",
]
doc = [
    "sphinx",
    "sphinx-rtd-theme",
]

[project.urls]
Documentation = "https://github.com/juansalmeronmoya/sense-emu-x#readme"
"Source Code" = "https://github.com/juansalmeronmoya/sense-emu-x"
"Issue Tracker" = "https://github.com/juansalmeronmoya/sense-emu-x/issues"

[project.scripts]
sense_rec = "sense_emu.record:app"
sense_play = "sense_emu.play:app"
sense_csv = "sense_emu.dump:app"
sense_emu_tui = "sense_emu.tui:main"

[project.gui-scripts]
sense_emu_gui = "sense_emu.pyside_app:main"

[tool.setuptools.dynamic]
version = { attr = "sense_emu.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["sense_emu*"]

[tool.setuptools.package-data]
sense_emu = [
    "*.png",
    "*.txt",
    "sense_emu_gui.svg",
    "examples/*/*.py",
    "locale/*/LC_MESSAGES/*.mo",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["docs", "sense_emu.egg-info"]

[tool.ruff.lint]
# Conservative first pass: real bugs only (pyflakes + syntax/runtime errors).
# Style rules and `ruff format --check` are enabled later, once the code has
# been reformatted in a dedicated commit.
select = ["E9", "F"]
ignore = [
    "F401",  # public re-exports in __init__ / optional imports
    "F403", "F405",  # star imports in sense_hat.py (kept for API compatibility)
]

[tool.ruff.lint.per-file-ignores]
# Tests keep some throwaway locals / re-defined fixtures for readability.
"tests/*" = ["F841", "F811"]
